name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example, v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and publish plugin
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm run build

      - name: Package plugin
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi

          stage="dist/Twinpad"
          rm -rf "$stage"
          mkdir -p "$stage/dist"
          cp plugin.json package.json main.py LICENSE README.md "$stage/"
          cp -a assets py_modules "$stage/"
          cp dist/index.js "$stage/dist/"
          (cd dist && zip -qr "decky-twinpad-${version}.zip" Twinpad)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          tag="v${version}"
          asset="dist/decky-twinpad-${version}.zip"
          prerelease_args=()
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            if (( ${#prerelease_args[@]} )); then
              gh release edit "$tag" "${prerelease_args[@]}"
            fi
          else
            gh release create "$tag" "$asset" \
              --target "$GITHUB_SHA" \
              --title "Twinpad Decky ${tag}" \
              --generate-notes \
              "${prerelease_args[@]}"
          fi
